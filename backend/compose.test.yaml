# Disposable integration database. No volumes or Supabase account required.
services:
  test-redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:17
    environment:
      POSTGRES_USER: fairdrop_test
      POSTGRES_PASSWORD: fairdrop_test
      POSTGRES_DB: fairdrop_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairdrop_test -d fairdrop_test"]
      interval: 2s
      timeout: 3s
      retries: 20
