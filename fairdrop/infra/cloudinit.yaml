#cloud-config
package_update: true
package_upgrade: true
packages: [ufw, fail2ban, unattended-upgrades, python3-venv, python3-pip]
write_files:
  - path: /etc/ssh/sshd_config.d/99-harden.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 3
runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 443/tcp
  - ufw allow from 10.20.0.0/24 to any port 6379 proto tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - systemctl restart ssh
